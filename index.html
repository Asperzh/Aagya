<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
    scroll-behavior:smooth;
}

body{
    background:linear-gradient(-45deg,#0F172A,#1E293B,#2563EB,#7C3AED);
    background-size:400% 400%;
    animation:gradientBG 12s ease infinite;
    color:white;
}

@keyframes gradientBG{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

header{
    position:fixed;
    width:100%;
    top:0;
    z-index:1000;
    backdrop-filter:blur(15px);
    background:rgba(255,255,255,0.08);
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 10%;
}

.logo{
    font-size:2rem;
    font-weight:700;
    color:#60A5FA;
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    transition:0.3s;
}

nav ul li a:hover{
    color:#60A5FA;
}

section{
    min-height:100vh;
    padding:120px 10%;
}

.hero{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
}

.hero-content{
    max-width:600px;
}

.hero-content h1{
    font-size:4rem;
    margin-bottom:10px;
}

.hero-content h2{
    color:#60A5FA;
    margin-bottom:15px;
}

.hero-content p{
    line-height:1.8;
    margin-bottom:25px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    color:white;
    background:#2563EB;
    padding:12px 28px;
